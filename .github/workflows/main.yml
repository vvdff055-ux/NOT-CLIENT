      - name: List files after build (debug)
        shell: powershell
        run: |
          Write-Host "Listing repo root:"
          Get-ChildItem -Force -Recurse -File -Path . | Select-Object FullName, Length | Out-String | Write-Host

      - name: Upload Custom Launcher EXE
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Minecraft-Launcher-EXE
          path: |
            installer/Output/*.exe
            installer/*.exe
            *.exe
            Output/*.exe
