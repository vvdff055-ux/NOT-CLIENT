name: Build Custom SK Launcher
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'false'

      - name: Install build tools
        shell: powershell
        run: |
          choco feature enable -n allowGlobalConfirmation
          choco install -y innosetup imagemagick
          RefreshEnv

      - name: Setup Tmp Directory for Installer Assets (safe)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer/tmp | Out-Null

          if (Test-Path "installer/logo.png") {
            # Try to generate icon and BMPs; check magick exit code instead of try/catch
            & magick "installer/logo.png" -define icon:auto-resize=256,128,64,48,32,16 "icon.ico"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ImageMagick failed to read installer/logo.png — file may be corrupted. Falling back to icon.ico or placeholders."
              if (Test-Path "icon.ico") { Copy-Item "icon.ico" "installer/tmp/icon.ico" -Force }
              New-Item -Path "installer/tmp/small.bmp" -ItemType File -Force | Out-Null
              New-Item -Path "installer/tmp/large.bmp" -ItemType File -Force | Out-Null
            } else {
              & magick "installer/logo.png" -resize 64x64 "installer/tmp/small.bmp"
              & magick "installer/logo.png" -resize 256x256 "installer/tmp/large.bmp"
              if (Test-Path "icon.ico") { Copy-Item "icon.ico" "installer/tmp/icon.ico" -Force } else { Copy-Item "icon.ico" "installer/tmp/icon.ico" -ErrorAction SilentlyContinue }
            }
          } elseif (Test-Path "icon.ico") {
            Copy-Item "icon.ico" "installer/tmp/icon.ico" -Force
            if (Test-Path "small.bmp") { Copy-Item "small.bmp" "installer/tmp/small.bmp" -Force } else { New-Item -Path "installer/tmp/small.bmp" -ItemType File -Force | Out-Null }
            if (Test-Path "large.bmp") { Copy-Item "large.bmp" "installer/tmp/large.bmp" -Force } else { New-Item -Path "installer/tmp/large.bmp" -ItemType File -Force | Out-Null }
          } else {
            New-Item -Path "installer/tmp/icon.ico" -ItemType File -Force | Out-Null
            New-Item -Path "installer/tmp/small.bmp" -ItemType File -Force | Out-Null
            New-Item -Path "installer/tmp/large.bmp" -ItemType File -Force | Out-Null
          }

          if (-not (Test-Path "installer/tmp/jre.zip")) {
            New-Item -Path "installer/tmp/jre.zip" -ItemType File -Force | Out-Null
          }

      - name: Auto Generate Build Script and Compile
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found on runner." }

          Write-Host "Running ISCC: $iscc installer\inno.iss"
          & $iscc "installer/inno.iss"

      - name: List files after build (debug)
        shell: powershell
        run: |
          Write-Host "---- Files in repo after build (top 200 lines) ----"
          Get-ChildItem -Force -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 4096 | Select-String -Pattern ".exe" -Context 0,2 | Out-String | Write-Host

      - name: Upload Custom Launcher EXE
        uses: actions/upload-artifact@v4
        with:
            name: Custom-Minecraft-Launcher-EXE
            path: |
             installer/Output/*.exe
             installer/*.exe
             *.exe
               Output/*.exe
